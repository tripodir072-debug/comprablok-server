<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso Seguro - TRATO</title>
    <style>
        :root { --blue: #1877F2; --dark: #020617; --neon: #00d2ff; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .login-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(20px); padding: 40px; border-radius: 40px; width: 90%; max-width: 350px; border: 1px solid rgba(255,255,255,0.1); text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .logo { font-size: 60px; margin-bottom: 10px; }
        h2 { margin: 10px 0; letter-spacing: -1px; font-size: 24px; }
        input { width: 100%; background: #0f172a; border: 2px solid #1e293b; padding: 18px; margin: 15px 0; border-radius: 20px; color: white; font-size: 18px; box-sizing: border-box; text-align: center; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--blue); box-shadow: 0 0 15px rgba(24, 119, 242, 0.3); }
        .btn-login { width: 100%; background: var(--blue); color: white; border: none; padding: 20px; border-radius: 22px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-size: 14px; }
        .error-msg { color: #ff4757; font-size: 12px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">🛡️</div>
        <h2>SISTEMA TRATO</h2>
        <p style="color: var(--neon); font-size: 10px; font-weight: bold; letter-spacing: 2px; margin-bottom: 30px;">AUTH SECURE ACCESS</p>
        
        <input type="password" id="pass" placeholder="LLAVE MAESTRA">
        <button class="btn-login" onclick="validar()">INGRESAR AL BÚNKER</button>
        
        <div id="error" class="error-msg">⚠️ LLAVE INCORRECTA</div>
        
        <div style="margin-top: 30px; font-size: 10px; opacity: 0.4;">RICHARDBRO® ARBITRAGE SYSTEM</div>
    </div>

    <script>
        function validar() {
            const pass = document.getElementById('pass').value;
            const error = document.getElementById('error');

            // ACÁ PODÉS CAMBIAR TU CONTRASEÑA
            if(pass === "richardbro2026") { 
                // Si es correcta, lo manda a la terminal de ventas
                window.location.href = "vender.html";
            } else {
                error.style.display = "block";
                document.getElementById('pass').value = "";
            }
        }
    </script>
</body>
</html>
